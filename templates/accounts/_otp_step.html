<div x-show="step === 'otp'" x-cloak>
  <h1 class="text-3xl font-extrabold">Check your email</h1>
  <p class="mt-2 text-ink-500">We sent a 6-digit code to <span class="font-semibold text-ink" x-text="form.email"></span>. It expires in 5 minutes.</p>
  <form class="mt-6" x-data="otpBoxes()" @otp-reset.window="reset()" @otp-complete="verify(code)" @submit.prevent="verify(code)">
    <div class="flex justify-between gap-2" @paste.prevent="fill($event.clipboardData.getData('text'))">
      <template x-for="(d, i) in digits" :key="i">
        <input :id="'otp' + i" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
               :value="digits[i]" @input="input(i, $event)" @keydown.backspace="back(i, $event)" :aria-label="'Digit ' + (i + 1)"
               class="h-14 w-12 rounded-xl border border-ink-100 bg-white text-center font-display text-2xl font-bold focus:border-ink focus:ring-0 sm:w-14">
      </template>
    </div>
    <p class="error-text" x-show="error" x-text="error"></p>
    <p class="mt-2 text-sm text-jade" x-show="info && !error" x-text="info"></p>
    <button class="btn-primary mt-6 w-full" :disabled="busy || code.length !== 6">
      <span x-text="busy ? 'Verifying…' : '{{ verify_label|default:"Verify and continue" }}'"></span>
    </button>
  </form>
  <div class="mt-4 flex items-center justify-between text-sm">
    <button class="text-ink-500 hover:text-ink" @click="step = 'credentials'; error = ''">Use a different email</button>
    <button class="font-medium" :class="cooldown > 0 ? 'text-ink-300' : 'link'" :disabled="cooldown > 0" @click="resend()"
            x-text="cooldown > 0 ? `Resend code in ${cooldown}s` : 'Resend code'"></button>
  </div>
</div>
