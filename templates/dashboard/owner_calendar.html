{% extends "dashboard/_owner_layout.html" %}
{% block title %}Calendar · Host · Alcove{% endblock %}
{% block dash %}
<div x-data="calendarPage()" x-init="load()">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <h1 class="text-3xl font-extrabold" x-text="title"></h1>
      <span class="chip bg-marigold-50 text-marigold-700" x-text="occupancy + '% occupied'"></span>
    </div>
    <div class="flex gap-2">
      <select x-model="property" @change="load()" class="field w-48" aria-label="Property">
        <option value="">All properties</option>
        {% for p in properties %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
      <button class="btn-ghost" @click="shift(-1)" aria-label="Previous month">‹</button>
      <button class="btn-ghost" @click="month = new Date().toISOString().slice(0, 7); load()">Today</button>
      <button class="btn-ghost" @click="shift(1)" aria-label="Next month">›</button>
    </div>
  </div>
  <div class="panel mt-5 overflow-hidden">
    <div class="grid grid-cols-7 border-b border-ink-100 bg-paper text-center text-xs font-medium text-ink-500">
      <template x-for="d in ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']"><div class="py-2" x-text="d"></div></template>
    </div>
    <div class="grid grid-cols-7">
      <template x-for="(day, i) in days" :key="i">
        <div class="min-h-28 border-b border-r border-ink-100 p-1.5" :class="!day.inMonth && 'bg-paper/70'">
          <p class="mb-1 text-right text-xs" :class="day.iso === todayIso ? 'font-bold text-ink' : day.inMonth ? 'text-ink-500' : 'text-ink-300'">
            <span :class="day.iso === todayIso && 'rounded-full bg-marigold px-1.5 py-0.5'" x-text="day.d"></span></p>
          <template x-for="e in eventsOn(day.iso).slice(0, 3)" :key="e.reference">
            <a :href="e.url" class="mb-0.5 block truncate rounded px-1.5 py-0.5 text-[11px] font-medium" :class="'st-' + e.status" :title="e.title + ' · ' + e.property" x-text="e.title"></a>
          </template>
          <p x-show="eventsOn(day.iso).length > 3" class="px-1 text-[11px] text-ink-500" x-text="'+' + (eventsOn(day.iso).length - 3) + ' more'"></p>
        </div>
      </template>
    </div>
  </div>
  <p class="mt-3 text-sm text-ink-500">Each stay appears on the nights the guest stays (check-out day is free).</p>
</div>
<script>
function calendarPage() {
  return {
    month: new Date().toISOString().slice(0, 7), property: "", events: [], occupancy: 0, todayIso: new Date().toISOString().slice(0, 10),
    get title() { const [y, m] = this.month.split("-"); return new Date(y, m - 1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" }); },
    get days() {
      const [y, m] = this.month.split("-").map(Number);
      const first = new Date(y, m - 1, 1), offset = (first.getDay() + 6) % 7, out = [];
      for (let i = 0; i < 42; i++) {
        const d = new Date(y, m - 1, 1 - offset + i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        out.push({ d: d.getDate(), iso, inMonth: d.getMonth() === m - 1 });
      }
      return out;
    },
    eventsOn(iso) { return this.events.filter((e) => e.start <= iso && iso < e.end); },
    shift(n) { const [y, m] = this.month.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); this.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; this.load(); },
    async load() {
      const d = await Alcove.api(`{% url 'owner_calendar_data' %}?month=${this.month}&property=${this.property}`);
      this.events = d.events; this.occupancy = d.occupancy;
    },
  };
}
</script>
{% endblock %}
