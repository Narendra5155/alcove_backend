{% extends "base.html" %}
{% block title %}Notifications · Alcove{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl px-4 py-10 sm:px-6" x-data="{ items: [], loaded: false }"
     x-init="Alcove.api('/api/notifications/?limit=100').then(d => { items = d.results; loaded = true })"
     @alcove:notification.window="items.unshift($event.detail)">
  <div class="flex items-end justify-between">
    <h1 class="text-4xl font-extrabold">Notifications</h1>
    <button class="btn-ghost" @click="$store.notifs.markAll(); items.forEach(n => n.is_read = true)">Mark all as read</button>
  </div>
  <ul class="panel mt-6 divide-y divide-ink-100">
    <template x-for="n in items" :key="n.id">
      <li>
        <a :href="n.url || '#'" @click="$store.notifs.markRead(n)" class="flex gap-4 p-4 hover:bg-paper" :class="!n.is_read && 'bg-marigold-50/60'">
          <span class="mt-2 h-2 w-2 shrink-0 rounded-full" :class="n.is_read ? 'bg-ink-100' : 'bg-marigold'"></span>
          <div class="min-w-0 flex-1"><p class="font-semibold" x-text="n.title"></p><p class="text-sm text-ink-500" x-text="n.body"></p></div>
          <span class="shrink-0 text-xs text-ink-300" x-text="Alcove.timeAgo(n.created_at)"></span>
        </a>
      </li>
    </template>
    <li x-show="loaded && !items.length" class="p-10 text-center text-ink-500">Nothing yet. Booking, payment and check-in updates will appear here as they happen.</li>
  </ul>
</div>
{% endblock %}
