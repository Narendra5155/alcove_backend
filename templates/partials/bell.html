<div class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
  <button @click="open = !open; if (open) $store.notifs.load()" class="relative rounded-full p-2 text-ink-500 hover:bg-ink-50 hover:text-ink" aria-label="Notifications" :aria-expanded="open">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.9 17.1a23.8 23.8 0 0 0 5.5-1.3A8.9 8.9 0 0 1 18 9.8V9a6 6 0 1 0-12 0v.8a8.9 8.9 0 0 1-2.3 6 24 24 0 0 0 5.4 1.3m5.8 0a24.3 24.3 0 0 1-5.8 0m5.8 0a3 3 0 1 1-5.8 0"/></svg>
    <span x-cloak x-show="$store.notifs.unread > 0" x-text="$store.notifs.unread > 9 ? '9+' : $store.notifs.unread"
          class="absolute -right-0.5 -top-0.5 flex h-5 min-w-5 items-center justify-center rounded-full bg-marigold px-1 text-[11px] font-bold text-ink ring-2 ring-white"></span>
  </button>
  <div x-cloak x-show="open" x-transition.origin.top.right class="absolute right-0 mt-2 w-[min(24rem,calc(100vw-2rem))] panel shadow-lg shadow-ink/5">
    <div class="flex items-center justify-between border-b border-ink-100 px-4 py-3">
      <p class="font-display text-base font-bold">Notifications</p>
      <button class="text-sm font-medium text-ink-500 hover:text-ink" @click="$store.notifs.markAll()" x-show="$store.notifs.unread > 0">Mark all as read</button>
    </div>
    <ul class="max-h-96 overflow-y-auto">
      <template x-for="n in $store.notifs.items" :key="n.id">
        <li>
          <a :href="n.url || '#'" @click="$store.notifs.markRead(n)" class="flex gap-3 px-4 py-3 hover:bg-paper" :class="!n.is_read && 'bg-marigold-50/60'">
            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full" :class="n.is_read ? 'bg-transparent' : 'bg-marigold'"></span>
            <span class="min-w-0">
              <span class="block text-sm font-semibold" x-text="n.title"></span>
              <span class="block text-sm text-ink-500" x-text="n.body"></span>
              <span class="mt-0.5 block text-xs text-ink-300" x-text="Alcove.timeAgo(n.created_at)"></span>
            </span>
          </a>
        </li>
      </template>
      <li x-show="$store.notifs.loaded && !$store.notifs.items.length" class="px-4 py-8 text-center text-sm text-ink-500">You're all caught up. Booking and payment updates will show up here.</li>
    </ul>
    <a href="{% url 'notifications' %}" class="block border-t border-ink-100 px-4 py-2.5 text-center text-sm font-medium text-ink-500 hover:text-ink">See all notifications</a>
  </div>
</div>
