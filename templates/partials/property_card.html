<a href="{% url 'property_detail' p.slug %}" class="group block">
  <div class="arch aspect-[4/5] bg-ink-50">
    {% if p.cover_url %}<img src="{{ p.cover_url }}" alt="{{ p.name }}" loading="lazy" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.03]">{% endif %}
  </div>
  <div class="mt-3 flex items-start justify-between gap-2">
    <div class="min-w-0">
      <p class="truncate font-semibold">{{ p.name }}</p>
      <p class="text-sm text-ink-500">{{ p.get_property_type_display }} in {{ p.city }}</p>
    </div>
    {% if p.rating %}<span class="shrink-0 text-sm font-semibold">★ {{ p.rating|floatformat:1 }}</span>{% endif %}
  </div>
  {% if p.starting_price %}<p class="mt-1 text-sm"><span class="font-semibold">₹{{ p.starting_price|floatformat:0 }}</span> <span class="text-ink-500">a night</span></p>{% endif %}
</a>
