<div class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[min(22rem,calc(100vw-2rem))] flex-col gap-2" aria-live="polite">
  <template x-for="t in $store.toasts.items" :key="t.id">
    <div x-transition.opacity class="pointer-events-auto flex gap-3 rounded-2xl border p-4 shadow-lg shadow-ink/10"
         :class="t.kind === 'error' ? 'border-rose/30 bg-white' : t.kind === 'success' ? 'border-jade/30 bg-white' : 'border-ink-100 bg-white'">
      <span class="mt-1 h-2.5 w-2.5 shrink-0 rounded-full" :class="t.kind === 'error' ? 'bg-rose' : t.kind === 'success' ? 'bg-jade' : 'bg-marigold'"></span>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold" x-text="t.title"></p>
        <p class="text-sm text-ink-500" x-show="t.body" x-text="t.body"></p>
        <a x-show="t.url" :href="t.url" class="mt-1 inline-block text-sm link">View</a>
      </div>
      <button @click="$store.toasts.dismiss(t.id)" class="self-start text-ink-300 hover:text-ink" aria-label="Dismiss">✕</button>
    </div>
  </template>
</div>
